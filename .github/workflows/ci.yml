name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Cancel superseded runs on the same PR/ref so a push to a branch with an
# in-flight CI run doesn't queue redundant jobs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Format check (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo +nightly fmt --all --check
      # examples/ are excluded from the workspace, so format them explicitly.
      - name: Check formatting of examples
        run: |
          set -e
          for dir in examples/*/; do
            if [ -f "$dir/Cargo.toml" ]; then
              echo "fmt: $dir"
              (cd "$dir" && cargo +nightly fmt --check)
            fi
          done

  doc:
    name: Docs build (no broken links)
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # tpt-appfront-webview needs webkit2gtk/GTK3 system libs not available on
      # ubuntu-latest; it is verified locally per AGENTS.md.
      - run: cargo doc --workspace --no-deps --exclude tpt-appfront-webview

  msrv:
    name: MSRV build (pinned toolchain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets --exclude tpt-appfront-webview

  native:
    name: Native (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # tpt-appfront-webview needs webkit2gtk/GTK3 system libs not available on
      # ubuntu-latest; it is verified locally per CLAUDE.md.
      - run: cargo build --workspace --all-targets --exclude tpt-appfront-webview
      - run: cargo test --workspace --exclude tpt-appfront-webview
      - run: cargo clippy --workspace --all-targets --exclude tpt-appfront-webview -- -D warnings

  wasm:
    name: WASM (browser backends)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p tpt-appfront-dom -p tpt-appfront-canvas --target wasm32-unknown-unknown
      - run: cargo clippy -p tpt-appfront-dom -p tpt-appfront-canvas --target wasm32-unknown-unknown --all-targets -- -D warnings

  wasm-tests:
    name: WASM browser tests (wasm-bindgen-test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install headless browser + wasm-bindgen-test-runner
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y chromium
          # Pin the runner to the wasm-bindgen version the project resolves to. The runner must
          # match it exactly, or wasm-bindgen-test-runner fails with a schema-version error.
          WB=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 2p | cut -d'"' -f2)
          cargo install wasm-bindgen-cli --version "$WB" --locked
      - name: Build & run tpt-appfront-dom browser tests
        env:
          WASM_BINDGEN_TEST_RUNNER_CHROME: /usr/bin/chromium
        run: |
          set -e
          cargo test -p tpt-appfront-dom --target wasm32-unknown-unknown --no-run
          # Run every test binary this build produced: the unit tests and each file in tests/.
          # The old glob matched only the unit-test binary, which has no browser tests, so the
          # tests in tests/ never ran.
          set -e
          for w in target/wasm32-unknown-unknown/debug/deps/*.wasm; do
            echo "== $w"
            wasm-bindgen-test-runner "$w"
          done

  cli-llm:
    name: CLI `llm` feature (clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The `llm` feature pulls in network/model-provider deps (ureq, serde,
      # syn). Lint it explicitly so that path can't bit-rot without needing
      # network access in CI (the tests are network-free — see llm/mod.rs).
      - run: cargo clippy -p tpt-appfront-cli --all-targets --features llm -- -D warnings

  canvas-x11:
    name: Canvas on X11 (Linux, virtual display)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth
      - name: Canvas tests and clippy (Linux)
        run: |
          cargo test -p tpt-appfront-canvas
          cargo clippy -p tpt-appfront-canvas --all-targets -- -D warnings
      - name: Open a real X11 window and paint frames
        # xvfb-run starts a virtual X server and sets DISPLAY to it. The smoke
        # example exits after its frame count, so a hang fails via the timeout.
        run: timeout 180 xvfb-run -a cargo run -p tpt-appfront-canvas --example platform_smoke -- 300

  webview-linux:
    name: Webview (Linux compile and clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          # wayland-sys (pulled in by rfd's xdg-portal backend) probes libwayland-client
          # through pkg-config while it builds. GTK3 and WebKitGTK are loaded at runtime on
          # Linux (docs/linux-webview-backend.md), so they are not needed to compile.
          sudo apt-get install -y pkg-config libwayland-dev
      # Compile-only for now: the webview's Linux tests and the window itself need a display.
      - run: cargo build -p tpt-appfront-webview
      - run: cargo clippy -p tpt-appfront-webview --all-targets -- -D warnings

  canvas-macos:
    name: Canvas (macOS build and tests)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # There is no macOS window backend yet, so this checks that the crate
      # builds and its tests pass. `run_native` returns PlatformError::Unsupported.
      - run: cargo test -p tpt-appfront-canvas
      - run: cargo clippy -p tpt-appfront-canvas --all-targets -- -D warnings

  audit:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-audit
      # RUSTSEC-2026-0194/0195: quick-xml DoS reachable only via wayland-scanner
      # build dep parsing trusted Wayland protocol .xml files, not runtime input.
      - run: cargo audit --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195

  deny:
    name: License / duplicate-version check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check

  examples:
    name: Examples (trunk build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/trunk-action@v0.5.1
        with:
          version: "latest"
      - name: Build every example under examples/*/index.html
        run: |
          set -e
          for dir in examples/*/; do
            if [ -f "$dir/index.html" ]; then
              echo "Building $dir"
              (cd "$dir" && trunk build)
            fi
          done
      - name: Build native (non-trunk) examples
        run: |
          set -e
          for dir in examples/*/; do
            if [ -f "$dir/Cargo.toml" ] && [ ! -f "$dir/index.html" ]; then
              # The webview host compiles against `wry`, which needs system
              # webview libraries (webkit2gtk on Linux) plus a pre-built
              # `ui/dist` produced by `trunk`. It is verified locally instead
              # of in this job to keep the runner image lean.
              if [ -f "$dir/ui/index.html" ]; then
                echo "Skipping webview example $dir (needs system webview libs + trunk build)"
                continue
              fi
              echo "Building native example $dir"
              (cd "$dir" && cargo build)
            fi
          done
