[package]
name = "tpt-appfront-canvas"
description = "Canvas backend for TPT AppFront: taffy layout, a software painter, and an internal Rust-only window layer."
readme = "README.md"
keywords = ["canvas", "gui", "taffy", "software-rendering", "window"]
categories = ["gui", "rendering", "wasm"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tpt-appfront-core = { path = "../tpt-appfront-core", version = "0.1" }
taffy = "0.12"
# Reads glyph outlines for the internal painter (crate::glyphs). MIT/Apache-2.0.
ttf-parser = "0.25"
# Image decoders for `NodeKind::Image` (src/image.rs). MIT OR Apache-2.0 (zune-jpeg and zune-core also Zlib).
png = "0.18"
zune-jpeg = "0.5.15"
zune-core = "0.5.1"
gif = "0.14"
image-webp = "0.2"

# Internal window layer (crate::platform). Win32 FFI only; MIT/Apache-2.0.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# Internal window layer, X11 backend (crate::platform::x11). Pure Rust: the
# protocol and handshake only, no libX11/libxcb. `x11rb` itself is not used
# because it depends on the banned `gethostname` crate.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11rb-protocol = { version = "0.13", features = ["std"] }

# Internal window layer, macOS backend (crate::platform::macos). The objc2 family:
# MIT, or Zlib/Apache-2.0/MIT. AppKit windows and Core Graphics drawing only.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSEvent",
    "NSGraphicsContext",
    "NSResponder",
    "NSView",
    "NSWindow",
] }
objc2-core-graphics = "0.3"
objc2-foundation = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "console",
    "CanvasRenderingContext2d",
    "DomRect",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "HtmlCanvasElement",
    "HtmlElement",
    "ImageData",
    "KeyboardEvent",
    "MouseEvent",
    "Window",
    "WheelEvent",
] }
