[package]
name = "tpt-appfront"
description = "Umbrella crate for TPT AppFront: one UITree, many backends behind feature flags, with a prelude."
readme = "README.md"
keywords = ["ui", "wasm", "canvas", "ssr", "tui"]
categories = ["gui", "web-programming", "wasm"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tpt-appfront-core = { path = "../tpt-appfront-core", version = "0.1" }
tpt-appfront-dom = { path = "../tpt-appfront-dom", version = "0.1", optional = true }
tpt-appfront-canvas = { path = "../tpt-appfront-canvas", version = "0.1", optional = true }
tpt-appfront-html = { path = "../tpt-appfront-html", version = "0.1", optional = true }
tpt-appfront-ai-schema = { path = "../tpt-appfront-ai-schema", version = "0.1", optional = true }
tpt-appfront-server = { path = "../tpt-appfront-server", version = "0.1", optional = true }
tpt-appfront-tui = { path = "../tpt-appfront-tui", version = "0.1", optional = true }
tpt-appfront-mcp = { path = "../tpt-appfront-mcp", version = "0.1", optional = true }
tpt-appfront-test = { path = "../tpt-appfront-test", version = "0.1", optional = true }
tpt-appfront-templates = { path = "../tpt-appfront-templates", version = "0.1", optional = true }

[features]
default = []
dom = ["dep:tpt-appfront-dom"]
canvas = ["dep:tpt-appfront-canvas"]
html = ["dep:tpt-appfront-html"]
ai-schema = ["dep:tpt-appfront-ai-schema"]
server = ["dep:tpt-appfront-server"]
tui = ["dep:tpt-appfront-tui"]
mcp = ["dep:tpt-appfront-mcp"]
test = ["dep:tpt-appfront-test"]
templates = ["dep:tpt-appfront-templates"]
# Bundles. `web` is the browser build: the DOM backend and the pure-Rust renderers, with no
# native-only dependencies (no server, no TUI). `full` enables every runtime backend and is for
# native targets; `test` stays separate because it is a test harness.
web = ["dom", "html", "ai-schema", "templates"]
full = ["dom", "canvas", "html", "ai-schema", "server", "tui", "mcp", "templates"]

[dev-dependencies]
# Enables the umbrella features for its own tests, so the README example resolves as written.
tpt-appfront = { path = ".", features = ["test"] }
# The cookbook tests (tests/cookbook.rs) exercise these without needing extra features.
# Path-only on purpose: cargo strips path-only dev-dependencies from the published manifest,
# and `cargo package` (the release dry run) does not need them on crates.io yet.
tpt-appfront-test = { path = "../tpt-appfront-test" }
tpt-appfront-html = { path = "../tpt-appfront-html" }

[[bench]]
name = "perf"
harness = false
