[package]
name = "tpt-appfront-webview"
description = "Thin OS-webview desktop shell (wry + tao) for TPT AppFront, hosting the DOM WASM bundle with no Electron/Node."
readme = "README.md"
keywords = ["webview", "desktop", "wry", "tao", "gui"]
categories = ["gui", "os"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = "1"
serde = { workspace = true }
serde_json = "1"
http = "1"
dirs = "5"
notify-rust = "4"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
keyring = "4"
crossbeam-channel = "0.5"
fs4 = "0.9"

# `tao` + `wry` host the webview on Windows and macOS. Linux uses its own backend
# (docs/linux-webview-backend.md), so these are not built there.
[target.'cfg(not(target_os = "linux"))'.dependencies]
tao = "0.37"
wry = "0.57"

# Linux loads GTK3 and WebKitGTK at runtime (docs/linux-webview-backend.md).
[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8"

# Windows: the native clipboard (`clipboard.rs`) and the tray (`tray.rs`, behind the
# `tray` feature) both use these Win32 bindings.
# macOS: the native clipboard (`clipboard.rs`) uses NSPasteboard. MIT OR Apache-2.0 (objc2).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["NSPasteboard"] }
objc2-foundation = "0.3"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
# Tray icon support. The Win32 code is always compiled on Windows; this flag only
# gates the tray module.
tray = []
